[workspace]
resolver = "2"
members = [
    "dt-airplay",
    "dt-audio",
    "dt-capture",
    "dt-encode",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[profile.release]
lto = true

# Video conversion/encoding is CPU-bound: dev builds are ~10-70x slower
# without optimizations, so keep a modest opt level for usable debug runs.
# Use `--release` for the real mirror session.
[profile.dev]
opt-level = 1
