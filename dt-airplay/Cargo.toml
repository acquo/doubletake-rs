[package]
name = "dt-airplay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AirPlay mirroring protocol layer (Rust port of omarroth/doubletake)"

[dependencies]
aes = "0.8"
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
ctr = "0.9"
curve25519-dalek = "4"
ed25519-dalek = "2"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
log = "0.4"
md-5 = "0.10"
mdns-sd = "0.21"
num-bigint = "0.4"
plist = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "1"
zeroize = "1"

[dev-dependencies]
env_logger = "0.11.11"
