[package]
name = "lumen-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows WASAPI loopback audio capture for lumen"

[dependencies]
log = "0.4"
thiserror = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
] }

[dev-dependencies]
env_logger = "0.11"
