[package]
name = "dt-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Screen capture for doubletake-rs (DXGI Desktop Duplication on Windows)"

[dependencies]
log = "0.4"
thiserror = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
] }

[dev-dependencies]
ctrlc = "3"
dt-airplay = { path = "../dt-airplay" }
dt-encode = { path = "../dt-encode" }
env_logger = "0.11"
